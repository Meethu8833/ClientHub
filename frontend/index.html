<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClientHub CRM</title>
    <script>
      // Runs BEFORE the bundle and before first paint, so the correct theme is
      // already on <html> and there is no white flash on load for dark-mode
      // users. Deliberately duplicates a few lines of src/features/theme/
      // theme.js: importing a module here would defeat the purpose by making
      // this async. Keep the storage key and class name in sync with that file.
      (function () {
        try {
          var pref = localStorage.getItem("clienthub-theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked — fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
