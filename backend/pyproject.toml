[tool.ruff]
line-length = 100
target-version = "py310"
# Migrations are machine-generated; never hand-lint them.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]  # errors, pyflakes, isort, bugbear, django

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
